<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Деструктуризация</title>
    <style>
        body { font-family: Arial; padding: 30px; background: #fafaf5; }
        .card { background: white; padding: 20px; border-radius: 16px; max-width: 500px; margin: 0 auto; }
        button { background: #79b224; color: white; border: none; border-radius: 30px; padding: 8px 16px; cursor: pointer; margin-bottom: 20px; }
        .info { background: #eef2e0; padding: 15px; border-radius: 12px; margin-top: 10px; }
        .old-way { background: #f9f1c0; padding: 10px; margin-top: 15px; border-radius: 8px; font-family: monospace; font-size: 12px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Деструктуризация объекта</h2>
        <button id="showBtn">Показать данные (деструктуризация)</button>
        <div id="result"></div>
    </div>
    <script>
        const user = {
            id: 1,
            name: 'Алексей',
            age: 25,
            email: 'alex@example.com',
            role: 'student'
        };
        document.getElementById('showBtn').addEventListener('click', () => {
            // Деструктуризация
            const { name, email, role } = user;
            // Старый способ (в комментарии для сравнения)
            // const nameOld = user.name; 
            // const emailOld = user.email; 
            // const roleOld = user.role;
            document.getElementById('result').innerHTML = `
                <div class="info">
                    <p><strong>Имя:</strong> ${name}</p>
                    <p><strong>Email:</strong> ${email}</p>
                    <p><strong>Роль:</strong> ${role}</p>
                </div>
                <div class="old-way">
                    <strong>Старый способ:</strong> // const name = user.name; const email = user.email; const role = user.role;
                </div>
            `;
        });
    </script>
</body>
</html>
