<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>События счётчик</title>
    <style>
        body { font-family: Arial; background: #fafaf5; padding: 30px; }
        .card { background: white; border-radius: 16px; padding: 20px; max-width: 300px; margin: 0 auto; text-align: center; }
        button { background: #79b224; border: none; color: white; border-radius: 30px; padding: 8px 20px; cursor: pointer; font-size: 18px; }
        .counter { font-size: 48px; margin: 15px 0; font-weight: bold; color: #5c7a1a; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Счётчик кликов</h2>
        <div class="counter" id="counterValue">0</div>
        <button id="clickBtn">Нажми меня</button>
    </div>
    <script>
        let count = 0;
        const counterSpan = document.getElementById('counterValue');
        const btn = document.getElementById('clickBtn');
        btn.addEventListener('click', () => {
            count++;
            counterSpan.textContent = count;
        });
    </script>
</body>
</html>
