<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title> форма регистрации</title>
    <style>
        body { font-family: Arial; background: #fafaf5; padding: 30px; }
        .card { background: white; border-radius: 16px; padding: 20px; max-width: 500px; margin: 0 auto; }
        input, button { width: 100%; padding: 8px; margin: 8px 0; border-radius: 8px; border: 1px solid #ccc; }
        button { background: #79b224; color: white; border: none; cursor: pointer; }
        .error { color: red; font-size: 14px; margin: 5px 0; }
        .success { color: green; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Регистрация</h2>
        <form id="regForm">
            <input type="text" id="name" placeholder="Имя">
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Пароль">
            <button type="submit">Зарегистрироваться</button>
            <div id="formMessage"></div>
        </form>
    </div>
    <script>
        const form = document.getElementById('regForm');
        const messageDiv = document.getElementById('formMessage');
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            let error = '';
            if (!name) error += 'Имя обязательно. ';
            if (!email) error += 'Email обязателен. ';
            if (!password) error += 'Пароль обязателен. ';
            if (error) {
                messageDiv.innerHTML = `<div class="error">${error}</div>`;
            } else {
                messageDiv.innerHTML = `<div class="success">Успех! Имя: ${name}, Email: ${email}</div>`;
            }
        });
    </script>
</body>
</html>
