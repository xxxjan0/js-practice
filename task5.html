<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Фильтрация и сортировка</title>
    <style>
        body { font-family: Arial; padding: 30px; background: #fafaf5; }
        .card { background: white; padding: 20px; border-radius: 16px; max-width: 800px; margin: 0 auto; }
        .filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
        .filters input, .filters select { padding: 8px; }
        button { background: #79b224; color: white; border: none; border-radius: 30px; padding: 8px 16px; cursor: pointer; }
        .product-item { background: #eef2e0; padding: 10px; margin: 5px 0; border-radius: 8px; display: flex; justify-content: space-between; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Каталог товаров</h2>
        <div class="filters">
            <input type="text" id="search" placeholder="Поиск">
            <select id="category">
                <option value="all">Все категории</option>
                <option value="Периферия">Периферия</option>
                <option value="Техника">Техника</option>
            </select>
            <select id="sort">
                <option value="none">Без сортировки</option>
                <option value="asc">По возрастанию цены</option>
                <option value="desc">По убыванию цены</option>
            </select>
            <button id="applyBtn">Применить</button>
        </div>
        <div id="result"></div>
    </div>
    <script>
        const products = [
            { title: 'Мышь', price: 1000, category: 'Периферия' },
            { title: 'Клавиатура', price: 3000, category: 'Периферия' },
            { title: 'Монитор', price: 15000, category: 'Техника' },
            { title: 'Наушники', price: 2500, category: 'Периферия' }
        ];
        function filterProducts(products, search, category) {
            return products.filter(p => {
                const matchSearch = search === '' || p.title.toLowerCase().includes(search.toLowerCase());
                const matchCategory = category === 'all' || p.category === category;
                return matchSearch && matchCategory;
            });
        }
        function sortProducts(products, direction) {
            if (direction === 'asc') return [...products].sort((a, b) => a.price - b.price);
            if (direction === 'desc') return [...products].sort((a, b) => b.price - a.price);
            return [...products];
        }
        document.getElementById('applyBtn').addEventListener('click', () => {
            const search = document.getElementById('search').value;
            const category = document.getElementById('category').value;
            const sort = document.getElementById('sort').value;
            let filtered = filterProducts(products, search, category);
            filtered = sortProducts(filtered, sort);
            const container = document.getElementById('result');
            if (filtered.length === 0) {
                container.innerHTML = '<div class="product-item">Товары не найдены</div>';
            } else {
                container.innerHTML = filtered.map(p => `<div class="product-item">${p.title} – ${p.price} ₽ (${p.category})</div>`).join('');
            }
        });
    </script>
</body>
</html>
