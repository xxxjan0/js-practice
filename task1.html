<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Калькулятор - функции</title>
    <style>
        body { font-family: Arial; background: #fafaf5; padding: 30px; }
        .card { max-width: 400px; margin: 0 auto; background: white; border-radius: 16px; padding: 20px; }
        input, select, button { margin: 8px 0; padding: 8px; width: 100%; }
        button { background: #79b224; color: white; border: none; border-radius: 30px; cursor: pointer; }
        .result { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
<div class="card">
    <h2>Калькулятор</h2>
    <input type="number" id="num1" placeholder="Число 1">
    <input type="number" id="num2" placeholder="Число 2">
    <select id="operation">
        <option value="add">+ Сложение</option>
        <option value="sub">- Вычитание</option>
        <option value="mul">* Умножение</option>
        <option value="div">/ Деление</option>
    </select>
    <button id="calcBtn">Вычислить</button>
    <div id="result" class="result"></div>
</div>
<script>
    function add(a, b) { return a + b; }
    function sub(a, b) { return a - b; }
    function mul(a, b) { return a * b; }
    function div(a, b) {
        if (b === 0) throw new Error('Деление на ноль невозможно');
        return a / b;
    }

    function calculate(a, b, op) {
        switch (op) {
            case 'add': return add(a, b);
            case 'sub': return sub(a, b);
            case 'mul': return mul(a, b);
            case 'div': return div(a, b);
            default: throw new Error('Неизвестная операция');
        }
    }

    const num1Input = document.getElementById('num1');
    const num2Input = document.getElementById('num2');
    const opSelect = document.getElementById('operation');
    const calcBtn = document.getElementById('calcBtn');
    const resultDiv = document.getElementById('result');

    calcBtn.addEventListener('click', () => {
        const a = parseFloat(num1Input.value);
        const b = parseFloat(num2Input.value);
        const op = opSelect.value;
        if (isNaN(a) || isNaN(b)) {
            resultDiv.textContent = 'Ошибка: введите оба числа';
            return;
        }
        try {
            const res = calculate(a, b, op);
            resultDiv.textContent = `Результат: ${res}`;
        } catch (err) {
            resultDiv.textContent = `Ошибка: ${err.message}`;
        }
    });
</script>
</body>
</html>
