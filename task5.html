<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>делегирование</title>
    <style>
        body { font-family: Arial; background: #fafaf5; padding: 30px; }
        .card { background: white; border-radius: 16px; padding: 20px; max-width: 800px; margin: 0 auto; }
        .product-card { background: #eef2e0; border-radius: 12px; padding: 15px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        button { background: #79b224; border: none; color: white; border-radius: 30px; padding: 6px 12px; cursor: pointer; margin-left: 10px; }
        .delete-btn { background: #c62828; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Каталог товаров</h2>
        <div id="productsContainer">
            <div class="product-card" data-name="Ноутбук">
                <span>Ноутбук</span>
                <div><button class="cart-btn">В корзину</button><button class="delete-btn">Удалить</button></div>
            </div>
            <div class="product-card" data-name="Мышь">
                <span>Мышь</span>
                <div><button class="cart-btn">В корзину</button><button class="delete-btn">Удалить</button></div>
            </div>
            <div class="product-card" data-name="Клавиатура">
                <span>Клавиатура</span>
                <div><button class="cart-btn">В корзину</button><button class="delete-btn">Удалить</button></div>
            </div>
        </div>
        <div id="message" style="margin-top: 15px; font-weight: bold;"></div>
    </div>
    <script>
        const container = document.getElementById('productsContainer');
        const messageDiv = document.getElementById('message');
        container.addEventListener('click', (e) => {
            const target = e.target;
            if (target.classList.contains('cart-btn')) {
                const card = target.closest('.product-card');
                const name = card.getAttribute('data-name');
                messageDiv.textContent = `Добавлен в корзину: ${name}`;
            } else if (target.classList.contains('delete-btn')) {
                const card = target.closest('.product-card');
                card.remove();
                messageDiv.textContent = 'Товар удалён';
            }
        });
    </script>
</body>
</html>
