<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Товар со спецификациями</title>
    <style>
        body { font-family: Arial; padding: 30px; background: #fafaf5; }
        .card { background: white; padding: 20px; border-radius: 16px; max-width: 500px; margin: 0 auto; }
        button { background: #79b224; color: white; border: none; border-radius: 30px; padding: 8px 16px; cursor: pointer; margin-bottom: 20px; }
        .product { background: #f5f7f0; padding: 15px; border-radius: 12px; }
        .specs { margin-top: 10px; padding-left: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Карточка товара</h2>
        <button id="showBtn">Показать товар</button>
        <div id="productContainer"></div>
    </div>
    <script>
        const product = {
            title: 'Ноутбук',
            price: 70000,
            specs: {
                cpu: 'Intel Core i5',
                ram: '16 GB',
                storage: '512 GB SSD'
            }
        };
        document.getElementById('showBtn').addEventListener('click', () => {
            const container = document.getElementById('productContainer');
            container.innerHTML = `
                <div class="product">
                    <p><strong>Название:</strong> ${product.title}</p>
                    <p><strong>Цена:</strong> ${product.price} ₽</p>
                    <p><strong>Характеристики:</strong></p>
                    <ul class="specs">
                        <li>Процессор: ${product.specs.cpu}</li>
                        <li>ОЗУ: ${product.specs.ram}</li>
                        <li>SSD: ${product.specs.storage}</li>
                    </ul>
                </div>
            `;
        });
    </script>
</body>
</html>
