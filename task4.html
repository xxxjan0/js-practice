<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Таблица заказов</title>
    <style>
        body { font-family: Arial; padding: 30px; background: #fafaf5; }
        .card { background: white; padding: 20px; border-radius: 16px; max-width: 1000px; margin: 0 auto; }
        button { background: #79b224; color: white; border: none; border-radius: 30px; padding: 8px 16px; cursor: pointer; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #9cb123; color: white; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Заказы</h2>
        <button id="showBtn">Показать таблицу</button>
        <div id="result"></div>
    </div>
    <script>
        const orders = [
            { number: 'A-1001', client: 'Анна', items: [{ price: 1000, count: 2 }, { price: 500, count: 1 }], status: 'Доставлен' },
            { number: 'A-1002', client: 'Иван', items: [{ price: 3000, count: 1 }], status: 'В обработке' }
        ];
        document.getElementById('showBtn').addEventListener('click', () => {
            const rows = orders.map(order => {
                const totalItems = order.items.reduce((sum, item) => sum + item.count, 0);
                const totalSum = order.items.reduce((sum, item) => sum + (item.price * item.count), 0);
                return `
                    <tr>
                        <td>${order.number}</td>
                        <td>${order.client}</td>
                        <td>${totalItems}</td>
                        <td>${totalSum} ₽</td>
                        <td>${order.status}</td>
                    </tr>
                `;
            }).join('');
            const html = `
                <table>
                    <thead><tr><th>Номер</th><th>Клиент</th><th>Кол-во товаров</th><th>Итог</th><th>Статус</th></tr></thead>
                    <tbody>${rows}</tbody>
                </table>
            `;
            document.getElementById('result').innerHTML = html;
        });
    </script>
</body>
</html>
