<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Объект пользователя</title>
    <style>
        body { font-family: Arial; padding: 30px; background: #fafaf5; }
        .card { background: white; padding: 20px; border-radius: 16px; max-width: 400px; margin: 0 auto; }
        button { background: #79b224; color: white; border: none; border-radius: 30px; padding: 8px 16px; cursor: pointer; margin-bottom: 20px; }
        .profile { border-top: 1px solid #ddd; padding-top: 15px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Профиль пользователя</h2>
        <button id="showBtn">Показать карточку</button>
        <div id="profileContainer" class="profile"></div>
    </div>
    <script>
        const user = {
            id: 1,
            name: 'Алексей',
            age: 25,
            email: 'alex@example.com',
            role: 'student'
        };
        document.getElementById('showBtn').addEventListener('click', () => {
            const container = document.getElementById('profileContainer');
            container.innerHTML = `
                <div style="background:#eef2e0; padding:15px; border-radius:12px;">
                    <p><strong>Имя:</strong> ${user.name}</p>
                    <p><strong>Возраст:</strong> ${user.age}</p>
                    <p><strong>Email:</strong> ${user.email}</p>
                    <p><strong>Роль:</strong> ${user.role}</p>
                </div>
            `;
        });
    </script>
</body>
</html>
