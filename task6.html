<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>DOM – модальное окно</title>
    <style>
        body { font-family: Arial; background: #fafaf5; padding: 30px; }
        button { background: #79b224; border: none; color: white; border-radius: 30px; padding: 8px 20px; cursor: pointer; }
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: black; display: none; justify-content: center; align-items: center;
        }
        .modal {
            background: white; padding: 30px; border-radius: 20px; width: 300px; text-align: center;
        }
        .modal button { margin-top: 15px; }
        .show { display: flex; }
    </style>
</head>
<body>
    <div style="text-align: center;">
        <button id="openBtn">Открыть модалку</button>
    </div>
    <div id="overlay" class="modal-overlay">
        <div class="modal">
            <p>Это модальное окно</p>
            <button id="closeBtn">Закрыть</button>
        </div>
    </div>
    <script>
        const overlay = document.getElementById('overlay');
        const openBtn = document.getElementById('openBtn');
        const closeBtn = document.getElementById('closeBtn');
        function openModal() { overlay.classList.add('show'); }
        function closeModal() { overlay.classList.remove('show'); }
        openBtn.addEventListener('click', openModal);
        closeBtn.addEventListener('click', closeModal);
        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) closeModal();
        });
    </script>
</body>
</html>
