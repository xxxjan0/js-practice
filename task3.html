<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>DOM</title>
    <style>
        body { font-family: Arial; background: #fafaf5; padding: 30px; }
        .card { background: white; border-radius: 16px; padding: 20px; max-width: 500px; margin: 0 auto; }
        input, button { padding: 8px; margin: 5px; }
        button { background: #79b224; border: none; color: white; border-radius: 30px; cursor: pointer; }
        ul { margin-top: 15px; list-style: none; padding-left: 0; }
        li { background: #eef2e0; margin: 5px 0; padding: 8px; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Добавление в список</h2>
        <input type="text" id="itemInput" placeholder="Название пункта">
        <button id="addBtn">Добавить</button>
        <ul id="list"></ul>
    </div>
    <script>
        const input = document.getElementById('itemInput');
        const addBtn = document.getElementById('addBtn');
        const list = document.getElementById('list');
        addBtn.addEventListener('click', () => {
            const text = input.value.trim();
            if (text === '') return;
            const li = document.createElement('li');
            li.textContent = text;
            list.appendChild(li);
            input.value = '';
        });
    </script>
</body>
</html>
