<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Списки пользователей</title>
    <style>
        body { font-family: Arial; padding: 30px; background: #fafaf5; }
        .card { background: white; padding: 20px; border-radius: 16px; max-width: 800px; margin: 0 auto; }
        button { background: #79b224; color: white; border: none; border-radius: 30px; padding: 8px 16px; cursor: pointer; margin-bottom: 20px; }
        .list-block { background: #f5f7f0; padding: 15px; margin-bottom: 15px; border-radius: 12px; }
        .list-block h3 { margin-bottom: 10px; color: #5c7a1a; }
        .stat { font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Анализ пользователей</h2>
        <button id="showBtn">Показать списки</button>
        <div id="result"></div>
    </div>
    <script>
        const users = [
            { id: 1, name: 'Анна', email: 'anna@example.com', role: 'admin', active: true },
            { id: 2, name: 'Иван', email: 'ivan@example.com', role: 'user', active: false },
            { id: 3, name: 'Олег', email: 'oleg@example.com', role: 'admin', active: true },
            { id: 4, name: 'Мария', email: 'maria@example.com', role: 'user', active: true }
        ];
        document.getElementById('showBtn').addEventListener('click', () => {
            const activeUsers = users.filter(u => u.active);
            const admins = users.filter(u => u.role === 'admin');
            const emails = users.map(u => u.email);
            const inactiveCount = users.filter(u => !u.active).length;
            const container = document.getElementById('result');
            container.innerHTML = `
                <div class="list-block">
                    <h3>Активные пользователи (${activeUsers.length})</h3>
                    ${activeUsers.map(u => `<div>${u.name} (${u.role})</div>`).join('')}
                </div>
                <div class="list-block">
                    <h3>Администраторы</h3>
                    ${admins.map(u => `<div>${u.name}</div>`).join('')}
                </div>
                <div class="list-block">
                    <h3>Email-адреса</h3>
                    ${emails.map(e => `<div>${e}</div>`).join('')}
                </div>
                <div class="list-block">
                    <div class="stat">Неактивных пользователей: ${inactiveCount}</div>
                </div>
            `;
        });
    </script>
</body>
</html>
