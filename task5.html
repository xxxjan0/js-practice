<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Шаблонные строки - карточка товара</title>
    <style>
        body { font-family: Arial; padding: 30px; background: #fafaf5; }
        .card { background: white; padding: 20px; border-radius: 16px; max-width: 500px; margin: 0 auto; }
        button { background: #79b224; color: white; border: none; border-radius: 30px; padding: 8px 16px; cursor: pointer; margin-bottom: 20px; }
        .product-card { background: #eef2e0; padding: 15px; border-radius: 12px; }
        .product-card button { background: #9cb123; margin-top: 10px; width: auto; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Товар</h2>
        <button id="showBtn">Создать карточку</button>
        <div id="productContainer"></div>
    </div>
    <script>
        const product = {
            name: 'Игровая мышь',
            price: 2500,
            category: 'Гейминг',
            description: 'Беспроводная мышь с подсветкой и 6 программируемыми кнопками.'
        };
        document.getElementById('showBtn').addEventListener('click', () => {
            const container = document.getElementById('productContainer');
            // Используем шаблонную строку `...${value}...`, без склейки +
            const cardHTML = `
                <div class="product-card">
                    <h3>${product.name}</h3>
                    <p>Цена: ${product.price} ₽</p>
                    <p>Категория: ${product.category}</p>
                    <p>Описание: ${product.description}</p>
                    <button>Купить</button>
                </div>
            `;
            container.innerHTML = cardHTML;
        });
    </script>
</body>
</html>
