<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Подготовка данных товаров</title>
    <style>
        body { font-family: Arial; padding: 30px; background: #fafaf5; }
        .card { background: white; padding: 20px; border-radius: 16px; max-width: 600px; margin: 0 auto; }
        button { background: #79b224; color: white; border: none; border-radius: 30px; padding: 8px 16px; cursor: pointer; margin-bottom: 20px; }
        .product { background: #eef2e0; padding: 12px; margin-bottom: 10px; border-radius: 12px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Подготовка товаров для UI</h2>
        <button id="showBtn">Показать подготовленные товары</button>
        <div id="result"></div>
    </div>
    <script>
        const products = [
            { title: 'Мышь', price: 1000, category: 'Периферия' },
            { title: 'Монитор', price: 15000, category: 'Техника' }
        ];
        document.getElementById('showBtn').addEventListener('click', () => {
            const prepared = products.map(product => ({
                ...product,
                priceString: `${product.price} ₽`,
                categoryText: `Категория: ${product.category}`,
                cardLabel: `Товар: ${product.title}`
            }));
            const container = document.getElementById('result');
            container.innerHTML = prepared.map(p => `
                <div class="product">
                    <strong>${p.cardLabel}</strong><br>
                    ${p.categoryText}<br>
                    Цена: ${p.priceString}
                </div>
            `).join('');
        });
    </script>
</body>
</html>
