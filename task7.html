<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Подготовка данных для карточек</title>
    <style>
        body { font-family: Arial; padding: 30px; background: #fafaf5; }
        .card { background: white; padding: 20px; border-radius: 16px; max-width: 800px; margin: 0 auto; }
        button { background: #79b224; color: white; border: none; border-radius: 30px; padding: 8px 16px; cursor: pointer; margin-bottom: 20px; }
        .product-card { background: #f5f7f0; padding: 15px; margin-bottom: 15px; border-radius: 12px; border-left: 5px solid #9cb123; }
        .in-stock { color: #2e7d32; font-weight: bold; }
        .out-stock { color: #c62828; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Подготовленные карточки товаров</h2>
        <button id="showBtn">Показать карточки</button>
        <div id="result"></div>
    </div>
    <script>
        const rawProducts = [
            { name: 'mouse', price: 1000, available: true },
            { name: 'keyboard', price: 3000, available: false }
        ];
        function prepareProducts(products) {
            return products.map(p => ({
                title: p.name.charAt(0).toUpperCase() + p.name.slice(1),
                priceFormatted: `${p.price} ₽`,
                availabilityText: p.available ? 'В наличии' : 'Нет в наличии',
                availabilityClass: p.available ? 'in-stock' : 'out-stock'
            }));
        }
        document.getElementById('showBtn').addEventListener('click', () => {
            const prepared = prepareProducts(rawProducts);
            const container = document.getElementById('result');
            container.innerHTML = prepared.map(p => `
                <div class="product-card">
                    <div><strong>${p.title}</strong></div>
                    <div>${p.priceFormatted}</div>
                    <div class="${p.availabilityClass}">${p.availabilityText}</div>
                </div>
            `).join('');
        });
    </script>
</body>
</html>
