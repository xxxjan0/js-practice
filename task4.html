<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>TODO список</title>
    <style>
        body { font-family: Arial; background: #fafaf5; padding: 30px; }
        .card { background: white; border-radius: 16px; padding: 20px; max-width: 600px; margin: 0 auto; }
        .add-section { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; padding: 8px; border-radius: 8px; border: 1px solid #ccc; }
        button { background: #79b224; border: none; color: white; border-radius: 30px; padding: 8px 16px; cursor: pointer; }
        .task { display: flex; align-items: center; gap: 10px; padding: 8px; background: #eef2e0; margin: 8px 0; border-radius: 8px; }
        .task.completed span { text-decoration: line-through; color: #888; }
        .task span { flex: 1; cursor: pointer; }
        .task button { background: #c62828; padding: 4px 12px; }
        .stats { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Мои задачи</h2>
        <div class="add-section">
            <input type="text" id="taskInput" placeholder="Новая задача...">
            <button id="addTaskBtn">Добавить</button>
        </div>
        <div id="tasksList"></div>
        <div class="stats" id="stats">Всего: 0, Выполнено: 0</div>
    </div>
    <script>
        let tasks = [];
        const tasksContainer = document.getElementById('tasksList');
        const taskInput = document.getElementById('taskInput');
        const statsDiv = document.getElementById('stats');
        function renderTasks() {
            tasksContainer.innerHTML = '';
            tasks.forEach((task, index) => {
                const taskDiv = document.createElement('div');
                taskDiv.className = 'task' + (task.completed ? ' completed' : '');
                const span = document.createElement('span');
                span.textContent = task.title;
                span.addEventListener('click', () => toggleTask(index));
                const delBtn = document.createElement('button');
                delBtn.textContent = 'Удалить';
                delBtn.addEventListener('click', () => deleteTask(index));
                taskDiv.appendChild(span);
                taskDiv.appendChild(delBtn);
                tasksContainer.appendChild(taskDiv);
            });
            const total = tasks.length;
            const completed = tasks.filter(t => t.completed).length;
            statsDiv.textContent = `Всего: ${total}, Выполнено: ${completed}`;
        }
        function addTask() {
            const title = taskInput.value.trim();
            if (title === '') return;
            tasks.push({ title, completed: false });
            taskInput.value = '';
            renderTasks();
        }
        function toggleTask(index) {
            tasks[index].completed = !tasks[index].completed;
            renderTasks();
        }
        function deleteTask(index) {
            tasks.splice(index, 1);
            renderTasks();
        }
        document.getElementById('addTaskBtn').addEventListener('click', addTask);
        taskInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') addTask(); });
        renderTasks();
    </script>
</body>
</html>
