<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>изменение текста</title>
    <style>
        body { font-family: Arial; background: #fafaf5; padding: 30px; }
        .card { background: white; border-radius: 16px; padding: 20px; max-width: 400px; margin: 0 auto; text-align: center; }
        button { background: #79b224; border: none; color: white; border-radius: 30px; padding: 8px 20px; cursor: pointer; margin-top: 15px; }
        h2 { color: #5c7a1a; }
    </style>
</head>
<body>
    <div class="card">
        <h2 id="myTitle">Привет, мир!</h2>
        <button id="changeBtn">Сменить текст</button>
    </div>
    <script>
        const title = document.querySelector('#myTitle');
        const btn = document.getElementById('changeBtn');
        btn.addEventListener('click', () => {
            title.textContent = 'Текст изменён через JS';
        });
    </script>
</body>
</html>
