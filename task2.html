<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Каталог по категориям</title>
    <style>
        body { font-family: Arial; padding: 30px; background: #fafaf5; }
        .card { background: white; padding: 20px; border-radius: 16px; max-width: 600px; margin: 0 auto; }
        button { background: #79b224; color: white; border: none; border-radius: 30px; padding: 8px 16px; cursor: pointer; margin-bottom: 20px; }
        .category { margin-bottom: 20px; background: #f5f7f0; padding: 15px; border-radius: 12px; }
        .category h3 { margin-bottom: 10px; color: #5c7a1a; }
        .product-item { padding: 5px 10px; background: white; margin: 5px 0; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Каталог по категориям</h2>
        <button id="showBtn">Показать каталог</button>
        <div id="result"></div>
    </div>
    <script>
        const categories = ['Периферия', 'Техника', 'Аксессуары'];
        const products = [
            { title: 'Мышь', category: 'Периферия' },
            { title: 'Клавиатура', category: 'Периферия' },
            { title: 'Монитор', category: 'Техника' },
            { title: 'Коврик', category: 'Аксессуары' }
        ];
        document.getElementById('showBtn').addEventListener('click', () => {
            const container = document.getElementById('result');
            let html = '';
            categories.forEach(cat => {
                const filtered = products.filter(p => p.category === cat);
                if (filtered.length > 0) {
                    html += `<div class="category">
                        <h3>${cat}</h3>
                        ${filtered.map(p => `<div class="product-item">${p.title}</div>`).join('')}
                    </div>`;
                } else {
                    html += `<div class="category"><h3>${cat}</h3><div class="product-item">Нет товаров</div></div>`;
                }
            });
            container.innerHTML = html;
        });
    </script>
</body>
</html>
