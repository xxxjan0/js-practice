<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>События live input</title>
    <style>
        body { font-family: Arial; background: #fafaf5; padding: 30px; }
        .card { background: white; border-radius: 16px; padding: 20px; max-width: 400px; margin: 0 auto; }
        input { width: 100%; padding: 8px; margin: 10px 0; border-radius: 8px; border: 1px solid #ccc; }
        .output { background: #eef2e0; padding: 10px; border-radius: 8px; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Печатайте ниже</h2>
        <input type="text" id="liveInput" placeholder="Введите текст...">
        <div class="output" id="preview">Текст появится здесь</div>
    </div>
    <script>
        const input = document.getElementById('liveInput');
        const preview = document.getElementById('preview');
        input.addEventListener('input', () => {
            const val = input.value.trim();
            preview.textContent = val === '' ? 'Текст появится здесь' : val;
        });
    </script>
</body>
</html>
