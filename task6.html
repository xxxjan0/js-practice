<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Чистые функции</title>
    <style>
        body { font-family: Arial; padding: 30px; background: #fafaf5; }
        .card { background: white; padding: 20px; border-radius: 16px; max-width: 800px; margin: 0 auto; }
        button { background: #79b224; color: white; border: none; border-radius: 30px; padding: 8px 16px; cursor: pointer; margin: 5px; }
        .output { background: #f5f7f0; padding: 15px; margin-top: 20px; border-radius: 12px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Чистые функции</h2>
        <button id="filterBtn">Фильтр по категории "Периферия"</button>
        <button id="searchBtn">Поиск "мышь"</button>
        <button id="sortAscBtn">Сортировка по цене (возр)</button>
        <button id="formatBtn">Форматировать</button>
        <div id="result" class="output"></div>
    </div>
    <script>
        const products = [
            { title: 'Мышь', price: 1000, category: 'Периферия' },
            { title: 'Клавиатура', price: 3000, category: 'Периферия' },
            { title: 'Монитор', price: 15000, category: 'Техника' }
        ];
        function filterByCategory(products, category) {
            return products.filter(p => p.category === category);
        }
        function searchProducts(products, query) {
            return products.filter(p => p.title.toLowerCase().includes(query.toLowerCase()));
        }
        function sortByPrice(products, direction) {
            if (direction === 'asc') return [...products].sort((a, b) => a.price - b.price);
            if (direction === 'desc') return [...products].sort((a, b) => b.price - a.price);
            return [...products];
        }
        function formatProducts(products) {
            return products.map(p => `${p.title}: ${p.price} ₽ (${p.category})`);
        }
        function render(data) {
            document.getElementById('result').innerHTML = data.length ? data.join('<br>') : 'Нет данных';
        }
        document.getElementById('filterBtn').addEventListener('click', () => {
            render(formatProducts(filterByCategory(products, 'Периферия')));
        });
        document.getElementById('searchBtn').addEventListener('click', () => {
            render(formatProducts(searchProducts(products, 'мышь')));
        });
        document.getElementById('sortAscBtn').addEventListener('click', () => {
            render(formatProducts(sortByPrice(products, 'asc')));
        });
        document.getElementById('formatBtn').addEventListener('click', () => {
            render(formatProducts(products));
        });
    </script>
</body>
</html>
