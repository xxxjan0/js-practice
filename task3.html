<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список пользователей</title>
    <style>
        body { font-family: Arial; padding: 30px; background: #fafaf5; }
        .card { background: white; padding: 20px; border-radius: 16px; max-width: 700px; margin: 0 auto; }
        button { background: #79b224; color: white; border: none; border-radius: 30px; padding: 8px 16px; cursor: pointer; margin-bottom: 20px; }
        .user-card { background: #f5f7f0; padding: 12px; margin-bottom: 12px; border-radius: 12px; border-left: 4px solid #9cb123; }
        .active { background: #c8e6c9; border-left-color: #2e7d32; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Пользователи</h2>
        <button id="showBtn">Показать список</button>
        <div id="usersContainer"></div>
    </div>
    <script>
        const users = [
            { id: 1, name: 'Анна', email: 'anna@example.com', role: 'admin', active: true },
            { id: 2, name: 'Иван', email: 'ivan@example.com', role: 'user', active: false },
            { id: 3, name: 'Олег', email: 'oleg@example.com', role: 'student', active: true }
        ];
        document.getElementById('showBtn').addEventListener('click', () => {
            const container = document.getElementById('usersContainer');
            container.innerHTML = users.map(user => `
                <div class="user-card ${user.active ? 'active' : ''}">
                    <p><strong>${user.name}</strong> (${user.role})</p>
                    <p>Email: ${user.email}</p>
                    <p>Статус: ${user.active ? 'Активен' : 'Не активен'}</p>
                </div>
            `).join('');
        });
    </script>
</body>
</html>
