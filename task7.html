<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>корзина</title>
    <style>
        body { font-family: Arial; background: #fafaf5; padding: 30px; }
        .container { display: flex; gap: 30px; flex-wrap: wrap; }
        .catalog, .cart { background: white; border-radius: 16px; padding: 20px; flex: 1; min-width: 250px; }
        .product { background: #eef2e0; padding: 12px; margin-bottom: 12px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; }
        button { background: #79b224; border: none; color: white; border-radius: 30px; padding: 6px 12px; cursor: pointer; }
        .cart-item { display: flex; justify-content: space-between; margin: 10px 0; background: #f9f1c0; padding: 8px; border-radius: 8px; }
        .total { margin-top: 20px; font-weight: bold; }
        .remove-btn { background: #c62828; }
    </style>
</head>
<body>
    <div class="container">
        <div class="catalog">
            <h2>Каталог</h2>
            <div id="catalogList"></div>
        </div>
        <div class="cart">
            <h2>Корзина</h2>
            <div id="cartItems"></div>
            <div id="cartTotal" class="total"></div>
        </div>
    </div>
    <script>
        const products = [
            { id: 1, name: 'Мышь', price: 1000 },
            { id: 2, name: 'Клавиатура', price: 3000 },
            { id: 3, name: 'Монитор', price: 15000 }
        ];
        let cart = []; // { id, name, price, quantity }
        function renderCatalog() {
            const container = document.getElementById('catalogList');
            container.innerHTML = products.map(p => `
                <div class="product">
                    <span>${p.name} – ${p.price} ₽</span>
                    <button class="add-to-cart" data-id="${p.id}">Добавить</button>
                </div>
            `).join('');
            document.querySelectorAll('.add-to-cart').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = parseInt(btn.getAttribute('data-id'));
                    const product = products.find(p => p.id === id);
                    addToCart(product);
                });
            });
        }
        function addToCart(product) {
            const existing = cart.find(item => item.id === product.id);
            if (existing) {
                existing.quantity++;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            renderCart();
        }
        function removeFromCart(id) {
            const index = cart.findIndex(item => item.id === id);
            if (index !== -1) cart.splice(index, 1);
            renderCart();
        }
        function updateQuantity(id, delta) {
            const item = cart.find(item => item.id === id);
            if (item) {
                item.quantity += delta;
                if (item.quantity <= 0) removeFromCart(id);
                else renderCart();
            }
        }
        function renderCart() {
            const cartContainer = document.getElementById('cartItems');
            if (cart.length === 0) {
                cartContainer.innerHTML = '<div>Корзина пуста</div>';
                document.getElementById('cartTotal').innerHTML = '';
                return;
            }
            let total = 0;
            cartContainer.innerHTML = cart.map(item => {
                total += item.price * item.quantity;
                return `
                    <div class="cart-item">
                        <span>${item.name} – ${item.price} ₽ x ${item.quantity} = ${item.price * item.quantity} ₽</span>
                        <div>
                            <button class="inc-qty" data-id="${item.id}">+</button>
                            <button class="dec-qty" data-id="${item.id}">-</button>
                            <button class="remove-btn" data-id="${item.id}">Удалить</button>
                        </div>
                    </div>
                `;
            }).join('');
            document.getElementById('cartTotal').innerHTML = `Итого: ${total} ₽`;
            document.querySelectorAll('.inc-qty').forEach(btn => {
                btn.addEventListener('click', () => updateQuantity(parseInt(btn.getAttribute('data-id')), 1));
            });
            document.querySelectorAll('.dec-qty').forEach(btn => {
                btn.addEventListener('click', () => updateQuantity(parseInt(btn.getAttribute('data-id')), -1));
            });
            document.querySelectorAll('.remove-btn').forEach(btn => {
                btn.addEventListener('click', () => removeFromCart(parseInt(btn.getAttribute('data-id'))));
            });
        }
        renderCatalog();
        renderCart();
    </script>
</body>
</html>
