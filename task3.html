<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Поиск пользователя</title>
    <style>
        body { font-family: Arial; padding: 30px; background: #fafaf5; }
        .card { background: white; padding: 20px; border-radius: 16px; max-width: 400px; margin: 0 auto; }
        input, button { margin: 10px 0; padding: 8px; width: 100%; }
        button { background: #79b224; color: white; border: none; border-radius: 30px; cursor: pointer; }
        .result { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Поиск пользователя по ID</h2>
        <input type="number" id="userId" placeholder="Введите id">
        <button id="searchUserBtn">Найти</button>
        <div id="result" class="result"></div>
    </div>
    <script>
        const users = [
            { id: 1, name: 'Анна' },
            { id: 2, name: 'Иван' },
            { id: 3, name: 'Олег' }
        ];
        const userIdInput = document.getElementById('userId');
        const searchBtn = document.getElementById('searchUserBtn');
        const resultDiv = document.getElementById('result');
        searchBtn.addEventListener('click', () => {
            const id = parseInt(userIdInput.value);
            if (isNaN(id)) {
                resultDiv.textContent = 'Введите число';
                return;
            }
            const user = users.find(u => u.id === id);
            if (user) resultDiv.textContent = `Имя пользователя: ${user.name}`;
            else resultDiv.textContent = 'Пользователь не найден';
        });
    </script>
</body>
</html>
